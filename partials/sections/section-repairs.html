    <!-- ================= แท็บ 2: จัดการใบส่งซ่อม ================= -->
    <section id="section-repairs" class="space-y-6 hidden">
      
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-3">
        <div class="flex flex-wrap items-center gap-2">
          <button onclick="openModal()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow flex items-center gap-1.5 transition" title="กรอกข้อมูลลงทะเบียนซ่อมผ่านฟอร์มมาตรฐาน">
            <span>+</span> เปิดใบส่งซ่อมใหม่
          </button>
          <button onclick="openQrScannerModal('repair')" class="bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-700 hover:to-teal-800 text-white px-3.5 py-2 rounded-lg text-sm font-semibold shadow flex items-center gap-1.5 transition" title="สแกน QR Code / Barcode บนตัวเครื่องเพื่อส่งซ่อมทันที">
            <span>📷</span> สแกน QR ส่งซ่อม
          </button>
          <button onclick="openNewWorkOrderDirectSlip()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow flex items-center gap-1.5 transition" title="พิมพ์และกรอกข้อมูลบนแบบฟอร์มเอกสารใบส่งซ่อมโดยตรง">
            <span>📄</span> กรอกบนแบบฟอร์มใบซ่อมโดยตรง
          </button>
          
          <label class="btn-import-export bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-3 py-2 rounded-lg text-sm font-medium cursor-pointer flex items-center gap-1.5 transition" title="นำเข้าประวัติงานส่งซ่อม">
            <span>📥</span> Import งานซ่อม Excel
            <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelImport(event)">
          </label>

          <label class="btn-import-export bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-300 px-3 py-2 rounded-lg text-sm font-medium cursor-pointer flex items-center gap-1.5 transition" title="นำเข้าไฟล์รายการครุภัณฑ์">
            <span>📦</span> Import ครุภัณฑ์ Excel
            <input type="file" id="equipExcelInput" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleEquipmentExcelImport(event)">
          </label>

          <button onclick="exportToExcel()" class="btn-import-export bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-lg text-sm font-medium shadow flex items-center gap-1.5 transition">
            <span>📊</span> Export รายงาน Excel
          </button>

          <button onclick="manualSyncFromCloud()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-lg text-sm font-medium shadow flex items-center gap-1.5 transition">
            <span>🔄</span> ดึงข้อมูลล่าสุดจาก Cloud
          </button>
        </div>

        <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
          <div class="flex items-center gap-1.5">
            <label for="repairFiscalYearFilter" class="text-xs font-semibold text-slate-600 whitespace-nowrap">📅 ปีงบฯ:</label>
            <select id="repairFiscalYearFilter" onchange="resetRepairPageAndRender()" class="border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs bg-slate-50 font-bold text-teal-800 focus:outline-teal-600">
              <option value="current" selected>ปีปัจจุบัน</option>
              <option value="all">ทุกปีงบฯ</option>
            </select>
          </div>
          <div class="flex items-center gap-1.5">
            <label for="repairSortBy" class="text-xs font-semibold text-slate-600 whitespace-nowrap">⇅ เรียงตาม:</label>
            <select id="repairSortBy" onchange="handleSortChange()" class="border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs bg-slate-50 font-semibold text-slate-700 focus:outline-teal-600">
              <option value="date-desc">วันที่แจ้ง (ใหม่ ➔ เก่า)</option>
              <option value="date-asc">วันที่แจ้ง (เก่า ➔ ใหม่)</option>
              <option value="repairNo-desc">เลขที่ใบส่งซ่อม (มาก ➔ น้อย)</option>
              <option value="repairNo-asc">เลขที่ใบส่งซ่อม (น้อย ➔ มาก)</option>
              <option value="duration-desc">ระยะเวลา/ค้างซ่อม (นานสุด ➔ น้อยสุด)</option>
              <option value="cost-desc">ค่าใช้จ่าย (มาก ➔ น้อย)</option>
              <option value="div-asc">แผนก/ตึก (ก-ฮ)</option>
            </select>
          </div>
          <input type="text" id="searchInput" aria-label="ค้นหาใบส่งซ่อม" oninput="resetRepairPageAndRender()" placeholder="ค้นหาเลขที่, แผนก, ครุภัณฑ์, ช่าง..." class="w-full sm:w-56 border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-teal-600">
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between">
        <!-- มุมมองตารางสำหรับคอมพิวเตอร์และแท็บเล็ต (Desktop & Tablet Table View) -->
        <div class="hidden md:block overflow-x-auto min-h-[20rem]">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-100 text-slate-600 uppercase text-xs border-b">
              <tr>
                <th class="py-3 px-4 cursor-pointer hover:bg-slate-200 transition select-none" onclick="toggleSortColumn('repairNo')">
                  เลขที่ใบส่งซ่อม <span id="sortIcon-repairNo"></span>
                </th>
                <th class="py-3 px-4 cursor-pointer hover:bg-slate-200 transition select-none" onclick="toggleSortColumn('date')">
                  วันที่แจ้ง <span id="sortIcon-date"></span>
                </th>
                <th class="py-3 px-4 cursor-pointer hover:bg-slate-200 transition select-none" onclick="toggleSortColumn('div')">
                  แผนก/ตึก <span id="sortIcon-div"></span>
                </th>
                <th class="py-3 px-4">รายการครุภัณฑ์</th>
                <th class="py-3 px-4">อาการเสีย</th>
                <th class="py-3 px-4">ผู้ดำเนินการซ่อม</th>
                <th class="py-3 px-4">สถานะ & ขั้นตอน</th>
                <th class="py-3 px-4 text-center cursor-pointer hover:bg-slate-200 transition select-none" onclick="toggleSortColumn('duration')">
                  ระยะเวลา <span id="sortIcon-duration"></span>
                </th>
                <th class="py-3 px-4 text-right cursor-pointer hover:bg-slate-200 transition select-none" onclick="toggleSortColumn('cost')">
                  ค่าใช้จ่าย (บาท) <span id="sortIcon-cost"></span>
                </th>
                <th class="py-3 px-4 text-center">จัดการ</th>
              </tr>
            </thead>
            <tbody id="repairTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>

        <!-- มุมมองการ์ดสำหรับโทรศัพท์มือถือ (Mobile Cards View) -->
        <div class="block md:hidden p-3 min-h-[16rem]">
          <div id="repairMobileCardsContainer" class="space-y-3"></div>
        </div>

        <div class="p-3 bg-slate-50 border-t flex flex-wrap items-center justify-between gap-3 text-xs text-slate-600">
          <div class="flex items-center gap-2">
            <label for="repairPageSize">แสดงแถวต่อหน้า:</label>
            <select id="repairPageSize" onchange="resetRepairPageAndRender()" class="border border-slate-300 rounded px-2 py-1 bg-white">
              <option value="10" selected>10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <span id="repairPaginationInfo">1-10 จาก 100</span>
            <button onclick="changeRepairPage(-1)" id="btnRepairPrev" class="px-3 py-1 border rounded bg-white hover:bg-slate-100 disabled:opacity-40">◀ ก่อนหน้า</button>
            <button onclick="changeRepairPage(1)" id="btnRepairNext" class="px-3 py-1 border rounded bg-white hover:bg-slate-100 disabled:opacity-40">ถัดไป ▶</button>
          </div>
        </div>
      </div>
    </section>
