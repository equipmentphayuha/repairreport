    <!-- ================= แท็บ 5: ทะเบียนพัสดุ / ครุภัณฑ์ ================= -->
    <section id="section-inventory" class="space-y-6 hidden">

    <!-- Inventory Action Header Toolbar -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-teal-100 text-teal-800 flex items-center justify-center text-xl shadow-inner font-bold">
                📦
            </div>
            <div>
                <h2 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2">
                    ทะเบียนครุภัณฑ์โรงพยาบาล
                </h2>
                <p class="text-xs text-slate-500">จัดการ ค้นหา สแกน QR และตรวจสอบประวัติครุภัณฑ์ทั้งหมดในระบบ</p>
            </div>
        </div>
        <div class="flex flex-wrap items-center gap-2">
            <!-- Button to open parcel form modal -->
            <button type="button" onclick="openParcelFormModal()"
                class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold shadow-md hover:shadow-lg flex items-center gap-1.5 transition-all transform hover:-translate-y-0.5">
                <span>➕</span> <span>เพิ่มครุภัณฑ์ใหม่</span>
            </button>
            <!-- Sync Controls -->
            <button id="pullCloudBtn"
                class="bg-blue-50 border border-blue-300 text-blue-700 px-3 py-2 rounded-xl shadow-sm text-xs sm:text-sm hover:bg-blue-100 flex items-center justify-center gap-1 font-semibold transition" title="ดึงข้อมูลล่าสุดจาก Cloud ลงมาเก็บในเครื่อง">
                📥 <span>ดึงจาก Cloud</span>
            </button>
            <button id="setAllReadyBtn"
                class="bg-emerald-50 border border-emerald-300 text-emerald-800 px-3 py-2 rounded-xl shadow-sm text-xs sm:text-sm hover:bg-emerald-100 flex items-center justify-center gap-1 font-semibold transition" title="ปรับสถานะครุภัณฑ์ทั้งหมดเป็น 'พร้อมใช้งาน' ทันที">
                ✅ <span>ปรับพร้อมใช้งานทั้งหมด</span>
            </button>
            <button id="setAllSupportBtn"
                class="bg-indigo-50 border border-indigo-300 text-indigo-800 px-3 py-2 rounded-xl shadow-sm text-xs sm:text-sm hover:bg-indigo-100 flex items-center justify-center gap-1 font-semibold transition" title="ปรับครุภัณฑ์ที่ไม่ใช่การแพทย์ให้เป็น 'เครื่องมือสนับสนุน' ทั้งหมด">
                🛠️ <span>ปรับเป็นเครื่องมือสนับสนุน</span>
            </button>
            <button id="cleanAsteriskBtn"
                class="bg-purple-50 border border-purple-300 text-purple-800 px-3 py-2 rounded-xl shadow-sm text-xs sm:text-sm hover:bg-purple-100 flex items-center justify-center gap-1 font-semibold transition" title="เปลี่ยนเครื่องหมาย * ในชื่อครุภัณฑ์เป็น x ทั้งหมดเพื่อป้องกันระบบ RMC+ ปฏิเสธ">
                ✏️ <span>เปลี่ยน * เป็น x ในชื่อ</span>
            </button>
            <button id="cleanDatesBtn"
                class="bg-cyan-50 border border-cyan-300 text-cyan-800 px-3 py-2 rounded-xl shadow-sm text-xs sm:text-sm hover:bg-cyan-100 flex items-center justify-center gap-1 font-semibold transition" title="ปรับรูปแบบวันที่ในระบบให้เป็น วว/ดด/ปปปป (พ.ศ.) มาตรฐาน">
                📅 <span>ปรับวันที่มาตรฐาน</span>
            </button>
            <button id="syncCloudBtn"
                class="bg-teal-600 text-white px-3 sm:px-3.5 py-2 rounded-xl shadow text-xs sm:text-sm hover:bg-teal-700 flex items-center justify-center gap-1 font-semibold transition-all" title="ส่งข้อมูลที่แก้ไขในเครื่องขึ้น Cloud">
                ☁️ <span>ส่งขึ้น Cloud</span> <span id="pendingSyncBadge" class="hidden bg-white text-emerald-800 text-[10px] font-extrabold px-1.5 py-0.5 rounded-full ml-0.5">0</span>
            </button>
            <button id="cancelCloudSyncBtn"
                class="bg-red-50 text-red-600 border border-red-300 px-2.5 py-2 rounded-xl shadow-sm text-xs hover:bg-red-100 flex items-center justify-center gap-1 font-semibold transition-all" title="ยกเลิกการแก้ไขที่ยังไม่ได้ส่งขึ้น Cloud">
                ❌ <span>ยกเลิก</span>
            </button>
            <button id="openConfigModalBtn"
                class="bg-slate-100 border border-slate-300 text-slate-700 px-3 py-2 rounded-xl shadow-sm text-xs sm:text-sm hover:bg-slate-200 flex items-center justify-center gap-1 font-medium transition">
                ⚙️ <span>ตั้งค่าฟิลด์</span>
            </button>
        </div>
    </div>

    <!-- Data Table & Controls Card -->
    <div class="max-w-7xl mx-auto bg-white p-3 sm:p-5 md:p-6 rounded-lg shadow-md">
        <div class="flex flex-col lg:flex-row justify-between items-stretch lg:items-center mb-4 gap-3">
            <div class="flex items-center justify-between">
                <h2 class="text-lg sm:text-xl font-bold text-gray-800 flex items-center gap-2">
                    📋 <span>รายการครุภัณฑ์</span> (<span id="totalItems" class="text-blue-600 font-extrabold">0</span>)
                </h2>
                <!-- Mobile View Switcher (Table vs Card) -->
                <div class="inline-flex rounded-md shadow-sm sm:hidden ml-2" role="group">
                    <button type="button" id="viewModeCardBtn" class="px-2.5 py-1 text-xs font-medium text-blue-700 bg-blue-100 rounded-l-lg border border-blue-300">
                        📇 การ์ด
                    </button>
                    <button type="button" id="viewModeTableBtn" class="px-2.5 py-1 text-xs font-medium text-gray-700 bg-white rounded-r-lg border border-gray-300">
                        📊 ตาราง
                    </button>
                </div>
            </div>

            <!-- Search & Action Toolbar -->
            <div class="flex flex-col sm:flex-row flex-wrap gap-2 items-stretch sm:items-center">
                <!-- QR Scanner Button -->
                <button type="button" onclick="openQrScannerModal('inventory')" class="bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold shadow flex items-center justify-center gap-1.5 transition" title="สแกน QR Code หรือบาร์โค้ดครุภัณฑ์เพื่อค้นหา">
                    <span>📷</span> <span>สแกน QR</span>
                </button>

                <!-- Search Box -->
                <div class="relative flex-1 sm:w-56">
                    <input type="text" id="parcelSearchInput" aria-label="ค้นหารายการครุภัณฑ์ทั่วไป" placeholder="🔍 ค้นหาทั่วไป..."
                        class="w-full border border-gray-300 pl-3 pr-8 py-2 rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <button id="clearSearchBtn" class="absolute right-2.5 top-2 text-gray-400 hover:text-gray-600 hidden text-sm font-bold">&times;</button>
                </div>

                <!-- Filter by Department / Div -->
                <div class="sm:w-44">
                    <select id="filterDivSelect" aria-label="กรองตามแผนกหรือกลุ่มงาน" class="w-full border border-gray-300 py-2 px-2.5 rounded-lg text-xs sm:text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium text-gray-700">
                        <option value="">🏢 ทุกแผนก/กลุ่มงาน</option>
                    </select>
                </div>

                <!-- Filter by Type -->
                <div class="sm:w-44">
                    <select id="filterTypeSelect" aria-label="กรองตามประเภทครุภัณฑ์" class="w-full border border-gray-300 py-2 px-2.5 rounded-lg text-xs sm:text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-purple-500 focus:outline-none font-medium text-gray-700">
                        <option value="">🏷️ ทุกประเภท</option>
                    </select>
                </div>

                <!-- Reset Filter Button -->
                <button type="button" id="resetFilterBtn" class="hidden text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 border border-gray-300 px-2.5 py-2 rounded-lg items-center gap-1 font-medium" title="ล้างตัวกรองทั้งหมด">
                    ✖ ล้างตัวกรอง
                </button>

                <!-- Action Buttons -->
                <div class="grid grid-cols-2 sm:flex sm:flex-wrap gap-1.5 sm:gap-2">
                    <button type="button" onclick="openBatchQrStickerModal()"
                        class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white px-3 py-2 rounded-lg shadow text-xs sm:text-sm font-bold flex items-center justify-center gap-1.5 transition transform hover:-translate-y-0.5"
                        title="พิมพ์สติกเกอร์ QR Code ทีละหลายรายการ หรือทั้งแผนกลงบนแผ่น A4">
                        <span>🏷️</span> <span>พิมพ์ QR ยกชุด</span>
                    </button>
                    <label for="importExcelFile" class="btn-import-export cursor-pointer bg-purple-600 text-white px-3 py-2 rounded-lg shadow text-xs sm:text-sm hover:bg-purple-700 flex items-center justify-center gap-1 font-medium">
                        📥 Import
                    </label>
                    <input type="file" id="importExcelFile" accept=".xlsx,.xls,.csv" class="hidden">
                    <button id="exportExcelBtn"
                        class="btn-import-export bg-emerald-600 text-white px-3 py-2 rounded-lg shadow text-xs sm:text-sm hover:bg-emerald-700 flex items-center justify-center gap-1 font-medium" title="ส่งออกข้อมูลครุภัณฑ์เป็นไฟล์ Excel">
                        📊 Excel
                    </button>
                    <button id="exportRmcBtn"
                        class="btn-import-export bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded-lg shadow text-xs sm:text-sm flex items-center justify-center gap-1 font-bold transition transform hover:-translate-y-0.5" title="ส่งออกไฟล์ Excel/CSV รูปแบบตาราง Pasadu สำหรับนำเข้าเว็บ RMC+ (rmcplus.com) โดยเฉพาะ">
                        🚀 <span>ส่งออก RMC+</span>
                    </button>
                    <button id="exportCsvBtn"
                        class="btn-import-export bg-blue-600 text-white px-3 py-2 rounded-lg shadow text-xs sm:text-sm hover:bg-blue-700 flex items-center justify-center gap-1 font-medium" title="ส่งออกข้อมูลแบบ CSV ทั่วไป">
                        📑 CSV
                    </button>
                    <button id="deleteAllBtn"
                        class="btn-admin-only bg-red-600 text-white px-3 py-2 rounded-lg shadow text-xs sm:text-sm hover:bg-red-700 flex items-center justify-center gap-1 font-medium col-span-2 sm:col-span-1">
                        🗑️ ลบทั้งหมด
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Card List View (visible on small screens when in card mode) -->
        <div id="mobileCardContainer" class="block sm:hidden space-y-3 mb-2">
            <!-- Dynamic Mobile Cards -->
        </div>

        <!-- Desktop & Tablet Table View -->
        <div id="tableContainerWrap" class="table-container border rounded-lg hidden sm:block">
            <table class="w-full text-xs text-left border-collapse">
                <thead class="bg-gray-100 sticky top-0 border-b shadow-sm" id="tableHead">
                    <!-- Dynamic Headers -->
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-200">
                    <!-- Dynamic Data Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Main App Module -->
    </section>
