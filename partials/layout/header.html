  <!-- Header -->
  <header class="bg-teal-700 text-white shadow-md sticky top-0 z-30 no-print">
    <div class="max-w-7xl mx-auto px-4 py-2 flex items-center justify-between gap-3 relative">
      <!-- ส่วนซ้าย: โลโก้ & ชื่อระบบ + ปุ่มทะเบียนพัสดุ & ใบส่งซ่อม -->
      <div class="flex items-center space-x-3 shrink-0">
        <!-- โลโก้ & ชื่อระบบ -->
        <div class="flex items-center space-x-2.5">
          <span class="text-xl">🏥</span>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-sm font-bold leading-tight whitespace-nowrap">ระบบครุภัณฑ์ &amp; ซ่อมบำรุง</h1>
              <span id="syncStatusBadge" class="text-[10px] font-medium px-1.5 py-0.5 rounded-full border bg-slate-100 text-slate-600 border-slate-200 transition-all whitespace-nowrap hidden lg:inline-block">
                ⏳ เชื่อมต่อ...
              </span>
            </div>
            <p class="text-[10px] text-teal-200 leading-none mt-0.5 hidden sm:block">โรงพยาบาลพยุหะคีรี จ.นครสวรรค์</p>
          </div>
        </div>

        <!-- แท็บหลัก: ทะเบียนพัสดุ & ใบส่งซ่อม (อยู่แถวเดียวกัน) -->
        <div class="flex items-center gap-1.5 pl-2 border-l border-teal-600/60">
          <button onclick="switchTab('inventory')" id="btn-tab-inventory"
            class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-teal-800 text-white shadow-sm hover:bg-teal-900 transition-all whitespace-nowrap flex items-center gap-1 border border-teal-500/40">
            <span>📦</span><span class="hidden sm:inline">ทะเบียนพัสดุ</span><span class="sm:hidden">พัสดุ</span>
          </button>
          <button onclick="switchTab('repairs')" id="btn-tab-repairs"
            class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-teal-600/70 text-teal-100 hover:bg-teal-800 hover:text-white transition-all whitespace-nowrap flex items-center gap-1 border border-teal-500/30">
            <span>🔧</span><span class="hidden sm:inline">ใบส่งซ่อม</span><span class="sm:hidden">ซ่อม</span>
          </button>
        </div>
      </div>

      <!-- ส่วนขวา: กราฟสถิติ (Admin/Executive) + Admin Tools Dropdown + User Profile Badge -->
      <div class="flex items-center gap-2 shrink-0">
        
        <!-- เมนูกราฟสถิติ (Admin/Executive) -->
        <div class="relative stat-tab-item" id="chartsMenuWrapper" style="display: none;">
          <button onclick="toggleChartsMenu(event)" id="btn-tab-charts"
            class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-teal-800 hover:bg-teal-900 text-white shadow transition-all flex items-center gap-1.5 border border-teal-500/40">
            <span>📊</span>
            <span>กราฟสถิติ</span>
            <span class="text-[10px] opacity-80">▾</span>
          </button>

          <!-- Dropdown Menu กราฟสถิติ -->
          <div id="chartsDropdownMenu"
            class="hidden absolute right-0 top-full mt-2 bg-white text-slate-800 rounded-xl shadow-2xl border border-slate-200 overflow-hidden z-50 min-w-[210px] animate-in fade-in zoom-in-95 duration-100">
            <div class="px-3 py-2 bg-teal-50 border-b border-teal-100 text-[11px] font-bold text-teal-800 flex items-center gap-1">
              <span>📈</span> รายงานและสถิติภาพรวม
            </div>
            <button onclick="selectChartTab('charts')"
              class="w-full text-left px-3.5 py-2.5 text-xs font-medium hover:bg-teal-50/70 flex items-center gap-2.5 transition-colors">
              <span class="text-base">🛠️</span>
              <div>
                <div class="font-bold text-slate-800">1. สถิติเครื่องมือ / งานซ่อม</div>
                <div class="text-[10px] text-slate-400">ภาพรวมค่าใช้จ่าย & แนวโน้มการซ่อม</div>
              </div>
            </button>
            <button onclick="selectChartTab('tables')"
              class="w-full text-left px-3.5 py-2.5 text-xs font-medium hover:bg-teal-50/70 flex items-center gap-2.5 transition-colors border-t border-slate-100">
              <span class="text-base">🏢</span>
              <div>
                <div class="font-bold text-slate-800">2. สถิติแผนก / ครุภัณฑ์</div>
                <div class="text-[10px] text-slate-400">สรุปความถี่ & ค่าใช้จ่ายแยกตามแผนก</div>
              </div>
            </button>
            <button onclick="selectChartTab('staff')"
              class="w-full text-left px-3.5 py-2.5 text-xs font-medium hover:bg-teal-50/70 flex items-center gap-2.5 transition-colors border-t border-slate-100">
              <span class="text-base">👷</span>
              <div>
                <div class="font-bold text-slate-800">3. สถิติเจ้าหน้าที่</div>
                <div class="text-[10px] text-slate-400">ผลงานช่าง & สถิติผู้ส่งซ่อม</div>
              </div>
            </button>
            <button onclick="selectChartTab('parcel_stats')"
              class="w-full text-left px-3.5 py-2.5 text-xs font-medium hover:bg-teal-50/70 flex items-center gap-2.5 transition-colors border-t border-slate-100">
              <span class="text-base">📦</span>
              <div>
                <div class="font-bold text-teal-800">4. สถิติ &amp; ค่าเสื่อมราคาครุภัณฑ์</div>
                <div class="text-[10px] text-slate-400">ภาพรวมครุภัณฑ์, มูลค่า และสถานะค่าเสื่อม</div>
              </div>
            </button>
          </div>
        </div>

        <!-- Admin Tools Dropdown -->
        <div class="relative" id="adminMenuWrapper" style="display:none;">
          <button onclick="toggleAdminMenu(event)" id="btn-admin-dropdown"
            class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white shadow transition-all flex items-center gap-1.5 border border-rose-400/40">
            <span>🛡️</span>
            <span>จัดการระบบ</span>
            <span class="text-[10px] opacity-80">▾</span>
          </button>
          
          <!-- Dropdown Popover -->
          <div id="adminDropdownMenu"
            class="hidden absolute right-0 top-full mt-2 bg-white text-slate-800 rounded-xl shadow-2xl border border-slate-200 overflow-hidden z-50 min-w-[190px] animate-in fade-in zoom-in-95 duration-100">
            <div class="px-3 py-2 bg-rose-50 border-b border-rose-100 text-[11px] font-bold text-rose-800 flex items-center gap-1">
              <span>⚙️</span> เครื่องมือผู้ดูแลระบบ
            </div>
            <button onclick="openAuditModal(); closeAdminMenu()" id="btn-audit-logs"
              class="w-full text-left px-3.5 py-2.5 text-xs font-medium hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
              <span class="text-base">📝</span>
              <div>
                <div class="font-bold text-slate-800">ประวัติ (Audit Log)</div>
                <div class="text-[10px] text-slate-400">ตรวจสอบการเพิ่ม/แก้/ลบ</div>
              </div>
            </button>
            <button onclick="openAdminUsersModal(); closeAdminMenu()" id="btn-tab-admin-users"
              class="w-full text-left px-3.5 py-2.5 text-xs font-medium hover:bg-slate-50 flex items-center gap-2.5 transition-colors border-t border-slate-100">
              <span class="text-base">👥</span>
              <div>
                <div class="font-bold text-slate-800">จัดการสมาชิก &amp; สิทธิ์</div>
                <div class="text-[10px] text-slate-400">อนุมัติ / กำหนดระดับผู้ใช้</div>
              </div>
            </button>
          </div>
        </div>

        <!-- User Badge -->
        <div id="userProfileHeaderBadge" class="flex items-center gap-1.5">
          <!-- โหลดข้อมูล Badge ผู้ใช้และปุ่ม Logout -->
        </div>
      </div>
    </div>

    <!-- ปุ่มสำรองสำหรับฟังก์ชัน tab เดิม -->
    <button onclick="switchTab('tables')" id="btn-tab-tables" style="display:none;"></button>
    <button onclick="switchTab('staff')" id="btn-tab-staff" style="display:none;"></button>
  </header>
