  <!-- ========================================================================= -->
  <!-- MODAL: เจ้าหน้าที่แก้ไขโปรไฟล์ตนเอง (UserProfile & Dept Change Request)     -->
  <!-- ========================================================================= -->
  <div id="selfProfileModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden no-print">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
      <div class="bg-gradient-to-r from-teal-700 to-slate-800 text-white px-5 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-xl">👤</span>
          <h3 class="font-bold text-sm sm:text-base">แก้ไขข้อมูลส่วนตัวของฉัน</h3>
        </div>
        <button type="button" onclick="closeSelfProfileModal()" class="text-white/70 hover:text-white text-lg">✕</button>
      </div>
      <form id="selfProfileForm" onsubmit="handleSelfProfileSubmit(event)" class="p-5 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">ชื่อ - นามสกุล (เปลี่ยนได้ทันที)</label>
          <input type="text" id="selfProfileName" required class="w-full border border-slate-300 rounded-lg p-2.5 text-xs focus:outline-teal-600 font-medium">
          <p class="text-[10px] text-emerald-600 mt-1">✨ เมื่อกดบันทึก ชื่อจะอัปเดตเปลี่ยนในระบบทันที</p>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">แผนกปัจจุบัน</label>
          <input type="text" id="selfProfileCurrentDept" disabled class="w-full border border-slate-200 bg-slate-100 text-slate-600 rounded-lg p-2 text-xs cursor-not-allowed">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">ขอย้ายไปกลุ่มงาน / แผนกใหม่ (ต้องรอแอดมินอนุมัติ)</label>
          <input type="text" id="selfProfileNewDept" list="divDatalist" placeholder="เลือกหรือพิมพ์แผนกใหม่ที่ต้องการย้าย" class="w-full border border-slate-300 rounded-lg p-2.5 text-xs focus:outline-teal-600">
          <div id="selfProfilePendingDeptNotice" class="hidden mt-2 p-2 bg-amber-50 border border-amber-200 rounded-lg text-amber-800 text-[11px] flex items-center gap-1.5">
            <span>⏳</span>
            <span>มีคำขอย้ายไปแผนก: <strong id="selfProfilePendingDeptName"></strong> (กำลังรอแอดมินอนุมัติ)</span>
          </div>
        </div>
        <div class="pt-3 border-t flex justify-end gap-2">
          <button type="button" onclick="closeSelfProfileModal()" class="px-3.5 py-1.5 border border-slate-300 text-slate-600 hover:bg-slate-100 rounded-lg text-xs font-semibold">ปิด</button>
          <button type="submit" id="selfProfileSubmitBtn" class="bg-teal-700 hover:bg-teal-800 text-white px-4 py-1.5 rounded-lg text-xs font-semibold shadow transition">💾 บันทึกข้อมูล</button>
        </div>
      </form>
    </div>
  </div>
