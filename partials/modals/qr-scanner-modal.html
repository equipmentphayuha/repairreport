  <!-- ========================================================================= -->
  <!-- MODAL: สแกน QR Code / Barcode ผ่านกล้องอุปกรณ์ (QR Scanner Modal)            -->
  <!-- ========================================================================= -->
  <div id="qrScannerModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 z-[99999] hidden no-print">
    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden flex flex-col max-h-[92vh] animate-fade-in">
      <div class="bg-gradient-to-r from-teal-700 to-slate-900 text-white px-5 py-4 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <span class="text-2xl">📷</span>
          <div>
            <h3 class="font-bold text-sm sm:text-base leading-tight">สแกน QR Code / Barcode</h3>
            <p class="text-[11px] text-teal-200" id="qrScannerTargetSubtitle">ส่องกล้องไปที่ป้าย QR หรือ Barcode บนเครื่อง</p>
          </div>
        </div>
        <button type="button" onclick="closeQrScannerModal()" class="text-white/70 hover:text-white text-2xl font-bold leading-none p-1">✕</button>
      </div>

      <div class="p-4 space-y-3 flex-1 flex flex-col items-center">
        <!-- ช่องแสดงภาพจากกล้อง -->
        <div class="w-full bg-slate-950 rounded-2xl overflow-hidden relative border-2 border-dashed border-teal-500 shadow-inner flex items-center justify-center min-h-[260px] sm:min-h-[300px]">
          <div id="qrScannerReader" class="w-full"></div>
          <div id="qrScannerLoading" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 text-white text-xs gap-2">
            <span class="animate-spin text-2xl">⏳</span>
            <span>กำลังเปิดกล้อง...</span>
          </div>
        </div>

        <!-- กล่องแสดงข้อความผลลัพธ์การสแกนล่าสุด -->
        <div id="qrScannerResultBox" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-center text-xs space-y-1">
          <div class="text-slate-500 text-[11px]">ผลการสแกนล่าสุด:</div>
          <div id="qrScannerResultText" class="font-mono font-bold text-teal-800 text-sm break-all">- ยังไม่มีข้อมูล -</div>
        </div>

        <!-- ตัวเลือกหรือปุ่มสลับกล้อง -->
        <div class="flex gap-2 w-full">
          <button type="button" onclick="toggleCameraFacing()" class="flex-1 py-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition">
            <span>🔄</span> สลับกล้องหน้า/หลัง
          </button>
          <button type="button" onclick="closeQrScannerModal()" class="py-2 px-4 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-xl text-xs font-semibold transition">
            ปิด
          </button>
        </div>
      </div>
    </div>
  </div>
