  <!-- ========================================================================= -->
  <!-- MODAL: ส่งซ่อมด่วนผ่าน QR Code (Fast-Track QR Repair Modal) -->
  <!-- ========================================================================= -->
  <div id="fastTrackRepairModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 z-[9999] hidden no-print">
    <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-150 border border-slate-100">
      <!-- Modal Header -->
      <div class="bg-gradient-to-r from-teal-700 via-teal-800 to-slate-900 text-white p-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-2xl bg-white/10 flex items-center justify-center text-xl shadow-inner font-bold">⚡</div>
          <div>
            <h3 class="font-bold text-base leading-tight flex items-center gap-2">
              <span>แจ้งซ่อมด่วนผ่าน QR (Fast-Track)</span>
            </h3>
            <p class="text-[11px] text-teal-200">ตรวจสอบข้อมูลครุภัณฑ์แล้วกดส่งซ่อมได้ทันที</p>
          </div>
        </div>
        <button type="button" onclick="closeFastTrackRepairModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center text-lg font-bold transition">
          ✕
        </button>
      </div>

      <!-- Equipment Summary Card -->
      <div class="p-4 bg-slate-50 border-b border-slate-200 space-y-2.5">
        <div class="flex items-start justify-between gap-2">
          <div>
            <div class="text-[11px] font-mono font-bold text-teal-800 bg-teal-100/70 border border-teal-200 px-2 py-0.5 rounded-md inline-block" id="ftEquipCode">
              -
            </div>
            <h4 class="font-bold text-slate-800 text-sm mt-1" id="ftEquipName">-</h4>
          </div>
          <span id="ftCriticalityBadge" class="text-[10px] font-bold px-2.5 py-1 rounded-full shrink-0">
            🟢 ทั่วไป
          </span>
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs text-slate-600 bg-white p-2.5 rounded-xl border border-slate-200/70">
          <div>
            <span class="text-slate-400 block text-[10px]">กลุ่มงาน/แผนก:</span>
            <span class="font-semibold text-slate-800" id="ftDept">-</span>
          </div>
          <div>
            <span class="text-slate-400 block text-[10px]">สถานที่จัดเก็บ/ติดตั้ง:</span>
            <span class="font-semibold text-slate-800" id="ftLocation">-</span>
          </div>
          <div>
            <span class="text-slate-400 block text-[10px]">หมวดหมู่อุปกรณ์:</span>
            <span class="font-semibold text-slate-800" id="ftCategory">-</span>
          </div>
          <div>
            <span class="text-slate-400 block text-[10px]">ผู้แจ้งซ่อม (ปัจจุบัน):</span>
            <span class="font-semibold text-teal-700" id="ftRequester">-</span>
          </div>
        </div>
      </div>

      <!-- Form Inputs -->
      <form id="fastTrackForm" onsubmit="handleFastTrackSubmit(event)" class="p-4 sm:p-5 space-y-3.5">
        <!-- Hidden values -->
        <input type="hidden" id="ftHiddenCode">
        <input type="hidden" id="ftHiddenName">
        <input type="hidden" id="ftHiddenDept">
        <input type="hidden" id="ftHiddenCategory">

        <!-- Symptom / Problem -->
        <div>
          <label for="ftSymptom" class="block text-xs font-bold text-slate-700 mb-1">
            ⚠️ อาการชำรุด / ปัญหาที่พบ <span class="text-rose-500">*</span>
          </label>
          <textarea id="ftSymptom" rows="2" required placeholder="เช่น เปิดเครื่องไม่ติด, ไฟไม่เข้า, หน้าจอไม่แสดงผล, มีเสียงดังผิดปกติ..."
            class="w-full border border-slate-300 rounded-xl p-2.5 text-xs sm:text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none bg-slate-50/50 focus:bg-white"></textarea>
          
          <!-- Quick symptom tags -->
          <div class="flex flex-wrap gap-1.5 mt-2">
            <span class="text-[10px] text-slate-400 self-center">อาการพบบ่อย:</span>
            <button type="button" onclick="fillFtSymptom('เปิดไม่ติด / ไฟไม่เข้า')" class="text-[11px] bg-slate-100 hover:bg-teal-50 hover:text-teal-700 text-slate-600 px-2 py-0.5 rounded-lg border border-slate-200 transition">เปิดไม่ติด</button>
            <button type="button" onclick="fillFtSymptom('หน้าจอดับ / หน้าจอเสีย')" class="text-[11px] bg-slate-100 hover:bg-teal-50 hover:text-teal-700 text-slate-600 px-2 py-0.5 rounded-lg border border-slate-200 transition">หน้าจอดับ</button>
            <button type="button" onclick="fillFtSymptom('ชำรุดแตกหัก / หลุดหลวม')" class="text-[11px] bg-slate-100 hover:bg-teal-50 hover:text-teal-700 text-slate-600 px-2 py-0.5 rounded-lg border border-slate-200 transition">ชำรุดแตกหัก</button>
            <button type="button" onclick="fillFtSymptom('ระบบขัดข้อง / ใช้งานไม่ได้')" class="text-[11px] bg-slate-100 hover:bg-teal-50 hover:text-teal-700 text-slate-600 px-2 py-0.5 rounded-lg border border-slate-200 transition">ระบบขัดข้อง</button>
          </div>
        </div>

        <!-- Priority / Urgency -->
        <div>
          <label for="ftUrgency" class="block text-xs font-bold text-slate-700 mb-1">ความเร่งด่วน</label>
          <select id="ftUrgency" class="w-full border border-slate-300 rounded-xl p-2 text-xs sm:text-sm bg-slate-50 focus:bg-white font-medium">
            <option value="ปกติ">🟢 ปกติ (General)</option>
            <option value="ด่วน">🟡 ด่วน (Urgent - กระทบงานบริการ)</option>
            <option value="ด่วนที่สุด">🔴 ด่วนที่สุด (Emergency - เครื่องมือช่วยชีวิต/ผู้ป่วยวิกฤต)</option>
          </select>
        </div>

        <!-- Submit & Cancel Buttons -->
        <div class="flex gap-2 pt-2 border-t border-slate-100">
          <button type="button" onclick="closeFastTrackRepairModal()" class="flex-1 py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition">
            ยกเลิก
          </button>
          <button type="submit" id="ftSubmitBtn" class="flex-2 py-2.5 px-5 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 text-white rounded-xl text-xs sm:text-sm font-bold shadow-md hover:shadow-lg transition flex items-center justify-center gap-1.5 active:scale-95">
            <span>🚀</span> <span>ส่งแจ้งซ่อมทันที (Submit)</span>
          </button>
        </div>
      </form>
    </div>
  </div>
