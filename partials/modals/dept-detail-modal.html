  <!-- ================= Modal: รายละเอียดใบส่งซ่อมแยกตามกลุ่มงาน / แผนก ================= -->
  <div id="deptDetailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-1 sm:p-4 no-print overflow-hidden">
    <div class="bg-white rounded-xl sm:rounded-2xl max-w-4xl w-full shadow-2xl flex flex-col h-[95vh] max-h-[95vh] sm:max-h-[90vh] modal-enter overflow-hidden">
      <!-- ส่วนหัว Modal -->
      <div class="bg-gradient-to-r from-teal-700 to-slate-800 text-white px-4 sm:px-5 py-3 sm:py-3.5 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2.5">
          <span class="text-2xl">🏢</span>
          <div>
            <h3 id="deptModalTitle" class="font-bold text-base leading-tight">กลุ่มงาน / แผนก</h3>
            <p id="deptModalSubtitle" class="text-xs text-teal-100">รายการใบส่งซ่อมทั้งหมดของกลุ่มงานนี้</p>
          </div>
        </div>
        <button type="button" onclick="closeDeptDetailModal()" class="text-slate-300 hover:text-white text-2xl font-bold leading-none p-1">&times;</button>
      </div>

      <!-- แถบสถิติย่อของกลุ่มงาน -->
      <div class="bg-slate-50 border-b border-slate-200 px-4 sm:px-5 py-2.5 sm:py-3 flex flex-wrap items-center justify-between gap-2 sm:gap-3 shrink-0 text-xs">
        <div class="flex flex-wrap items-center gap-2 sm:gap-3">
          <span class="bg-teal-100 text-teal-800 px-2.5 py-1 rounded-full font-bold" id="deptModalStatTotal">ทั้งหมด 0 ใบ</span>
          <span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-semibold" id="deptModalStatCompleted">เสร็จ 0 ใบ</span>
          <span class="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-semibold" id="deptModalStatPending">ค้างซ่อม 0 ใบ</span>
          <span class="bg-slate-200 text-slate-800 px-2.5 py-1 rounded-full font-semibold" id="deptModalStatCost">งบประมาณรวม 0 บ.</span>
        </div>
        <button id="deptModalFilterBtn" type="button" class="text-teal-700 hover:text-teal-900 font-semibold flex items-center gap-1">
          <span>🔍</span> ดูในหน้าตารางหลัก
        </button>
      </div>

      <!-- รายการใบซ่อมของกลุ่มงาน (Scrollable) -->
      <div class="p-3 sm:p-5 overflow-y-auto flex-1 min-h-0" style="-webkit-overflow-scrolling: touch;">
        <div id="deptModalRepairsList" class="space-y-2.5">
          <!-- สร้างรายการโดย JS -->
        </div>
      </div>

      <!-- ส่วนท้าย Modal -->
      <div class="bg-slate-50 px-4 sm:px-5 py-2 sm:py-2.5 border-t border-slate-200 flex justify-end shrink-0">
        <button type="button" onclick="closeDeptDetailModal()" class="px-4 py-1.5 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-100 text-xs font-semibold">ปิดหน้าต่าง</button>
      </div>
    </div>
  </div>
