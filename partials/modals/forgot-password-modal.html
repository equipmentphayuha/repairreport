  <!-- ========================================================================= -->
  <!-- MODAL: ลืมรหัสผ่าน / ขอรีเซ็ตรหัสผ่าน (Self-Service Password Reset)         -->
  <!-- ========================================================================= -->
  <div id="forgotPasswordModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-[10000] hidden no-print">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden animate-fade-in">
      <div class="bg-gradient-to-r from-teal-700 to-slate-800 text-white px-5 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-xl">🔑</span>
          <h3 class="font-bold text-sm sm:text-base">รีเซ็ตรหัสผ่าน</h3>
        </div>
        <button type="button" onclick="closeForgotPasswordModal()" class="text-white/70 hover:text-white text-lg">✕</button>
      </div>
      <form id="forgotPasswordForm" onsubmit="handleForgotPasswordSubmit(event)" class="p-5 space-y-3.5">
        <p class="text-xs text-slate-600 leading-relaxed">
          กรอกอีเมลที่ลงทะเบียนไว้ ระบบความปลอดภัยจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปยังกล่องข้อความของคุณทันที
        </p>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">อีเมลของคุณ</label>
          <input type="email" id="forgotPassEmail" required placeholder="name@email.com" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs bg-slate-50 focus:bg-white focus:outline-teal-600">
        </div>
        <div id="forgotPassAlert" class="hidden p-2.5 rounded-lg text-xs"></div>
        <div class="pt-2 border-t flex justify-end gap-2">
          <button type="button" onclick="closeForgotPasswordModal()" class="px-3 py-1.5 border border-slate-300 text-slate-600 hover:bg-slate-100 rounded-lg text-xs font-semibold">ยกเลิก</button>
          <button type="submit" id="forgotPassSubmitBtn" class="bg-teal-700 hover:bg-teal-800 text-white px-4 py-1.5 rounded-lg text-xs font-semibold shadow transition">📨 ส่งลิงก์รีเซ็ต</button>
        </div>
      </form>
    </div>
  </div>
