<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Content Security Policy (CSP): รองรับ Tailwind CDN, Firebase, Chart.js, SheetJS, Google Fonts และ WebSockets อย่างปลอดภัย -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://www.gstatic.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com data:;
    connect-src 'self' https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com https://cdn.jsdelivr.net https://www.gstatic.com;
    img-src 'self' data: blob: https:;
    frame-src 'self';
  ">

  <title>ระบบซ่อมแซมครุภัณฑ์ - โรงพยาบาลพยุหะคีรี</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Import Map เพื่อให้ Live Server หรือ Browser สามารถ Resolve Bare Specifiers ได้ทันที -->
  <script type="importmap">
    {
      "imports": {
        "chart.js/auto": "https://cdn.jsdelivr.net/npm/chart.js@4.4.8/auto/auto.js",
        "chart.js": "https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.js",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
        "xlsx": "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
        "jszip": "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js",
        "pptxgenjs": "https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js",
        "html2canvas": "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
      }
    }
  </script>
  
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>">
  
  <!-- Global Scripts (Tailwind, Chart.js, QR Scanner, QR Code) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- Targets for Modular Partials -->
  <div id="authTarget">
    <div id="initialAppLoading" class="fixed inset-0 z-[9999] bg-gradient-to-br from-slate-900 via-teal-950 to-slate-900 flex flex-col items-center justify-center p-4">
      <div class="animate-spin rounded-full h-12 w-12 border-4 border-teal-500 border-t-transparent mb-4"></div>
      <div class="text-white font-medium text-sm animate-pulse tracking-wide">กำลังเตรียมระบบ...</div>
    </div>
  </div>

  <div id="appRootContainer" style="display: none;">
    <div id="headerTarget"></div>

    <main id="mainSectionsTarget" class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6"></main>

    <datalist id="equipmentsDatalist"></datalist>
    <datalist id="divDatalist"></datalist>
    <datalist id="requesterDatalist"></datalist>

    <div id="modalsTarget"></div>
  </div>

  <!-- Client-side HTML Loader & Application Bootstrapper -->
  <script>
    (async function initAppShell() {
      const fetchHtml = async (path) => {
        const res = await fetch(path);
        if (!res.ok) throw new Error(`ไม่สามารถโหลดไฟล์: ${path}`);
        return res.text();
      };

      try {
        // 1. Concurrent Fetch of all UI partials
        const [
          authHtml,
          headerHtml,
          chartsHtml,
          tablesHtml,
          repairsHtml,
          staffHtml,
          parcelStatsHtml,
          inventoryHtml,
          ...modals
        ] = await Promise.all([
          fetchHtml('partials/auth/auth-gatekeeper.html'),
          fetchHtml('partials/layout/header.html'),
          fetchHtml('partials/sections/section-charts.html'),
          fetchHtml('partials/sections/section-tables.html'),
          fetchHtml('partials/sections/section-repairs.html'),
          fetchHtml('partials/sections/section-staff.html'),
          fetchHtml('partials/sections/section-parcel-stats.html'),
          fetchHtml('partials/sections/section-inventory.html'),
          fetchHtml('partials/modals/parcel-form-modal.html'),
          fetchHtml('partials/modals/config-modal.html'),
          fetchHtml('partials/modals/import-modal.html'),
          fetchHtml('partials/modals/sync-modal.html'),
          fetchHtml('partials/modals/repair-modal.html'),
          fetchHtml('partials/modals/staff-modal.html'),
          fetchHtml('partials/modals/print-work-order-modal.html'),
          fetchHtml('partials/modals/print-executive-report-modal.html'),
          fetchHtml('partials/modals/dept-detail-modal.html'),
          fetchHtml('partials/modals/export-modal.html'),
          fetchHtml('partials/modals/audit-modal.html'),
          fetchHtml('partials/modals/admin-users-modals.html'),
          fetchHtml('partials/modals/self-profile-modal.html'),
          fetchHtml('partials/modals/forgot-password-modal.html'),
          fetchHtml('partials/modals/qr-scanner-modal.html'),
          fetchHtml('partials/modals/fast-track-repair-modal.html'),
          fetchHtml('partials/modals/executive-one-page-modal.html'),
          fetchHtml('partials/modals/qr-sticker-modals.html'),
          fetchHtml('partials/modals/equipment-passport-modal.html')
        ]);

        // 2. Inject DOM Elements
        const authTarget = document.getElementById('authTarget');
        if (authTarget) authTarget.outerHTML = authHtml;

        const headerTarget = document.getElementById('headerTarget');
        if (headerTarget) headerTarget.outerHTML = headerHtml;

        const mainTarget = document.getElementById('mainSectionsTarget');
        if (mainTarget) {
          mainTarget.innerHTML = [
            chartsHtml,
            tablesHtml,
            repairsHtml,
            staffHtml,
            parcelStatsHtml,
            inventoryHtml
          ].join('\n');
        }

        const modalsTarget = document.getElementById('modalsTarget');
        if (modalsTarget) modalsTarget.outerHTML = modals.join('\n');

        // 3. Load Application Modules Sequentially
        const appScripts = [
          { src: 'js/common/app-namespace.js' },
          { src: 'js/common/store.js', type: 'module' },
          { src: 'js/common/firebase.js', type: 'module' },
          { src: 'js/common/auth-guard.js' },
          { src: 'js/common/qr-scanner.js' },
          { src: 'js/common/audit-view.js' },
          { src: 'js/repair/repair-storage.js' },
          { src: 'js/repair/repair-excel.js' },
          { src: 'js/repair/repair-dashboard.js' },
          { src: 'js/repair/repair-staff.js' },
          { src: 'js/repair/repair-core.js' },
          { src: 'js/parcel/parcel-core.js?v=2.0.0', type: 'module' }
        ];

        for (const item of appScripts) {
          await new Promise((resolve, reject) => {
            const s = document.createElement('script');
            if (item.type) s.type = item.type;
            s.src = item.src;
            s.onload = resolve;
            s.onerror = (e) => reject(new Error('โหลดสคริปต์ไม่สำเร็จ: ' + item.src));
            document.body.appendChild(s);
          });
        }

        // 4. Trigger Lifecycle Initialization
        document.dispatchEvent(new Event('DOMContentLoaded'));
        if (typeof window.initRepairSystem === 'function') {
          try {
            await window.initRepairSystem();
          } catch (e) {
            console.error('Error during initRepairSystem initialization:', e);
          }
        } else if (typeof window.onload === 'function') {
          try {
            await window.onload();
          } catch (e) {
            console.error('Error during onload initialization:', e);
          }
        }
      } catch (err) {
        console.error('Bootstrap Error:', err);
        alert('เกิดข้อผิดพลาดในการโหลดโมดูลหน้าเว็บ: ' + err.message);
      }
    })();
  </script>
</body>
</html>
